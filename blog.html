<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhyShock - Tech Blog</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="blogs.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
</head>
<body class="dark-theme">
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <div class="glitch-text" data-text="LOADING BLOG">LOADING BLOG</div>
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
            <div class="loading-percentage">0%</div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html" style="text-decoration: none; color: inherit;">
                    <span class="glitch-text" data-text="WHYSHOCK">WHYSHOCK</span>
                </a>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link">HOME</a>
                <a href="index.html#about" class="nav-link">ABOUT</a>
                <a href="index.html#projects" class="nav-link">PROJECTS</a>
                <a href="index.html#skills" class="nav-link">SKILLS</a>
                <a href="blog.html" class="nav-link active">BLOG</a>
                <a href="index.html#contact" class="nav-link">CONTACT</a>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Blog Section -->
    <section id="blog" class="blog-section">
        <div class="hero-background">
            <div class="cyber-grid"></div>
        </div>
        
        <div class="container">
            <!-- Blog List View -->
            <div id="blog-list-view">
                <div class="blog-header">
                    <p class="blog-subtitle">
                        Tech, life, and everything in between.
                    </p>
                </div>

                <div class="blog-filters" id="blog-filters">
                    <button class="filter-btn active" data-tag="all">All Posts</button>
                    <!-- Filter buttons are generated dynamically from blog tags -->
                </div>

                <div class="blog-grid" id="blog-posts-container">
                    <!-- Blog posts will be dynamically loaded here -->
                </div>

                <div class="blog-pagination">
                    <button class="pagination-btn" id="prev-page" disabled>
                        <i class="fas fa-chevron-left"></i> Previous
                    </button>
                    <span class="pagination-info">Page <span id="current-page">1</span> of <span id="total-pages">1</span></span>
                    <button class="pagination-btn" id="next-page" disabled>
                        Next <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>

            <!-- Single Blog Post View -->
            <div id="blog-post-view" style="display: none;">
                <div class="blog-post-header">
                    <button class="back-btn" id="back-to-list">
                        <i class="fas fa-arrow-left"></i> Back to Blog
                    </button>
                </div>

                <!-- Reading Toolbar -->
                <div class="reading-toolbar" id="reading-toolbar">
                    <div class="toolbar-group">
                        <span class="toolbar-label">Text</span>
                        <button class="toolbar-btn" id="font-decrease" title="Decrease text size" aria-label="Decrease text size">
                            <i class="fas fa-minus"></i>
                        </button>
                        <span class="font-size-display" id="font-size-display">100%</span>
                        <button class="toolbar-btn" id="font-increase" title="Increase text size" aria-label="Increase text size">
                            <i class="fas fa-plus"></i>
                        </button>
                        <div class="toolbar-divider"></div>
                        <button class="toolbar-btn" id="font-reset" title="Reset text size" aria-label="Reset text size">
                            <i class="fas fa-undo"></i>
                        </button>
                    </div>
                    <div class="toolbar-group">
                        <span class="toolbar-label">Width</span>
                        <button class="toolbar-btn" id="width-narrow" title="Narrow reading width" aria-label="Narrow reading width">
                            <i class="fas fa-compress-alt"></i>
                        </button>
                        <button class="toolbar-btn active" id="width-normal" title="Normal reading width" aria-label="Normal reading width">
                            <i class="fas fa-arrows-alt-h"></i>
                        </button>
                        <button class="toolbar-btn" id="width-wide" title="Wide reading width" aria-label="Wide reading width">
                            <i class="fas fa-expand-alt"></i>
                        </button>
                    </div>
                </div>

                <!-- Reading Progress Bar -->
                <div class="reading-progress" id="reading-progress"></div>

                <div class="blog-post-layout">
                    <!-- Sidebar: All Posts Navigation -->
                    <aside class="blog-sidebar" id="blog-sidebar">
                        <div class="sidebar-header">
                            <a href="#" class="sidebar-all-posts" id="sidebar-back-to-list">All posts</a>
                        </div>
                        <div class="sidebar-search">
                            <input type="text" id="sidebar-search-input" placeholder="Search posts..." aria-label="Search blog posts">
                        </div>
                        <nav class="sidebar-posts-list" id="sidebar-posts-list">
                            <!-- Populated by JS -->
                        </nav>
                    </aside>

                    <!-- Main Post Content -->
                    <div class="blog-post-main">
                        <article class="blog-post-content" id="blog-post-article">
                    <div class="post-meta">
                        <div class="post-date" id="post-date"></div>
                        <div class="post-tags" id="post-tags"></div>
                    </div>
                    
                    <div class="post-image-container" id="post-image-container" style="display: none;">
                        <img id="post-image" alt="Blog post image">
                    </div>
                    
                    <div class="post-body" id="post-body">
                        <!-- Blog content will be loaded here -->
                    </div>
                    
                    <div class="post-footer">
                        <div class="post-share">
                            <h4>Share this post</h4>
                            <div class="share-buttons">
                                <button class="share-btn twitter" onclick="sharePost('twitter')">
                                    <i class="fab fa-twitter"></i> Twitter
                                </button>
                                <button class="share-btn linkedin" onclick="sharePost('linkedin')">
                                    <i class="fab fa-linkedin"></i> LinkedIn
                                </button>
                                <button class="share-btn copy" onclick="copyPostUrl()">
                                    <i class="fas fa-link"></i> Copy Link
                                </button>
                            </div>
                        </div>
                    </div>
                </article>
                    </div><!-- .blog-post-main -->
                </div><!-- .blog-post-layout -->
            </div>

            <!-- Image Zoom Overlay -->
            <div class="image-zoom-overlay" id="image-zoom-overlay">
                <button class="zoom-close" id="zoom-close" aria-label="Close zoom"><i class="fas fa-times"></i></button>
                <img id="zoom-image" alt="Zoomed image">
                <div class="zoom-controls">
                    <button class="toolbar-btn" id="zoom-out-btn" title="Zoom out" aria-label="Zoom out"><i class="fas fa-search-minus"></i></button>
                    <button class="toolbar-btn" id="zoom-reset-btn" title="Reset zoom" aria-label="Reset zoom"><i class="fas fa-undo"></i></button>
                    <button class="toolbar-btn" id="zoom-in-btn" title="Zoom in" aria-label="Zoom in"><i class="fas fa-search-plus"></i></button>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-text">
                    <p>&copy; 2025 WhyShock. All rights reserved.</p>
                </div>
                <div class="footer-social">
                    <a href="mailto:vaishak.i.kuppast@gmail.com" class="social-link">
                        <i class="fas fa-envelope"></i>
                    </a>
                    <a href="https://linkedin.com/in/vaishakikuppast" class="social-link" target="_blank">
                        <i class="fab fa-linkedin"></i>
                    </a>
                    <a href="https://github.com/vaishakik" class="social-link" target="_blank">
                        <i class="fab fa-github"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Floating Theme Toggle -->
    <button id="theme-toggle" class="floating-theme-toggle">
        <i class="fas fa-sun"></i>
    </button>

    <script src="script.js"></script>
    <script src="blog.js"></script>
</body>
</html>
