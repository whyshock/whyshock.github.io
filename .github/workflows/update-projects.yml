name: Update Projects from GitHub

on:
  schedule:
    - cron: '0 0 * * 0' # Runs weekly on Sunday
  workflow_dispatch: # Manual trigger

jobs:
  update-projects:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch projects from GitHub repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch all public repos
          repos=$(curl -s "https://api.github.com/users/Vaishak/repos?per_page=100&sort=updated" \
            -H "Accept: application/vnd.github.v3+json")

          # For each repo, check if project.json exists
          echo "[" > projects.json
          first=true

          for repo_name in $(echo "$repos" | python3 -c "
          import sys, json
          repos = json.load(sys.stdin)
          for r in repos:
              if not r['fork'] and not r['archived']:
                  print(r['name'])
          "); do
            # Try to fetch project.json from the repo
            project_data=$(curl -s "https://raw.githubusercontent.com/Vaishak/${repo_name}/main/project.json" 2>/dev/null)
            
            # Check if it's valid JSON (file exists)
            if echo "$project_data" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null; then
              if [ "$first" = true ]; then
                first=false
              else
                echo "," >> projects.json
              fi
              # Add repo URL to the project data
              echo "$project_data" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          data['repo_url'] = 'https://github.com/Vaishak/${repo_name}'
          json.dump(data, sys.stdout)" >> projects.json
            fi
          done

          echo "]" >> projects.json
          echo "Generated projects.json:"
          cat projects.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects.json
          git diff --cached --quiet || git commit -m "chore: auto-update projects from GitHub repos"
          git push
