<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Models — WhyShock</title>
    <link rel="icon" type="image/svg+xml" href="../../img/favicon.svg">
    <link rel="stylesheet" href="../../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .models-section { padding: 8rem 0 4rem; position: relative; }
        .models-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        .model-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
        }
        .model-card:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 10px 40px rgba(59,130,246,0.15);
            transform: translateY(-4px);
        }
        .model-embed {
            position: relative;
            padding-top: 63.6%;
        }
        .model-embed iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        @media (max-width: 768px) {
            .models-grid { grid-template-columns: 1fr; padding: 0 1rem; }
        }
    </style>
</head>
<body class="dark-theme">
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="../../index.html" style="text-decoration:none;color:inherit;">
                    <span class="glitch-text" data-text="WHYSHOCK">WHYSHOCK</span>
                </a>
            </div>
            <div class="nav-menu">
                <a href="../../index.html" class="nav-link">HOME</a>
                <a href="../../index.html#about" class="nav-link">ABOUT</a>
                <a href="../../index.html#projects" class="nav-link">PROJECTS</a>
                <a href="../../blog.html" class="nav-link">BLOG</a>
                <a href="../../index.html#contact" class="nav-link">CONTACT</a>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <section class="models-section">
        <div class="hero-background">
            <div class="cyber-grid"></div>
        </div>
        <div class="container" style="text-align:center;margin-bottom:3rem;">
            <h2 class="section-title">
                <span class="glitch-text" data-text="3D MODELS">3D MODELS</span>
            </h2>
            <p style="color:var(--text-secondary);font-size:1.1rem;max-width:600px;margin:1rem auto 0;">
                Interactive 3D models created for AR/VR education and digital heritage preservation. Rotate, zoom, and explore.
            </p>
        </div>

        <div class="models-grid">
            <div class="model-card">
                <div class="model-embed">
                    <iframe title="3D Model" src="https://sketchfab.com/models/aca23e253cfa4c318f286e5846d6f6fc/embed?autostart=1&preload=1&ui_theme=dark" allowfullscreen allow="autoplay; fullscreen; xr-spatial-tracking"></iframe>
                </div>
            </div>

            <div class="model-card">
                <div class="model-embed">
                    <iframe title="3D Model" src="https://sketchfab.com/models/5d25104252bc4efabb7721e8b471716b/embed?autostart=1&preload=1&ui_theme=dark" allowfullscreen allow="autoplay; fullscreen; xr-spatial-tracking"></iframe>
                </div>
            </div>

            <div class="model-card">
                <div class="model-embed">
                    <iframe title="3D Model" src="https://sketchfab.com/models/98a9dc4ab2b742dfa94529b3c2ab6958/embed?autostart=1&preload=1&ui_theme=dark" allowfullscreen allow="autoplay; fullscreen; xr-spatial-tracking"></iframe>
                </div>
            </div>

            <div class="model-card">
                <div class="model-embed">
                    <iframe title="3D Model" src="https://sketchfab.com/models/7497fb8f48964f59ae10ee27727351af/embed?autostart=1&preload=1&ui_theme=dark" allowfullscreen allow="autoplay; fullscreen; xr-spatial-tracking"></iframe>
                </div>
            </div>

            <div class="model-card">
                <div class="model-embed">
                    <iframe title="3D Model" src="https://sketchfab.com/models/7b2b5f8ace2d4e0999931235994ab0e6/embed?autostart=1&preload=1&ui_theme=dark" allowfullscreen allow="autoplay; fullscreen; xr-spatial-tracking"></iframe>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-text">
                    <p>&copy; 2025 WhyShock. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Floating Theme Toggle -->
    <button id="theme-toggle" class="floating-theme-toggle">
        <i class="fas fa-sun"></i>
    </button>

    <script src="../../script.js"></script>
