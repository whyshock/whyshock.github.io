    <title>Garmin Fitness Dashboard</title>
    <script>
      // Apply theme immediately before React renders to prevent flash
      (function() {
        try {
          var keys = Object.keys(localStorage);
          var theme = null;
          for (var i = 0; i < keys.length; i++) {
            if (keys[i].endsWith(':preferences')) {
              var prefs = JSON.parse(localStorage.getItem(keys[i]));
              if (prefs && prefs.theme) { theme = prefs.theme; break; }
            }
          }
          if (!theme) theme = 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch(e) {}
      })();
    </script>
